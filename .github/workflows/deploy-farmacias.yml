name: Despliegue farmacias Service en Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/services/farmacias-service/**'    

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias y compilar
        run: |
          cd backend/services/farmacias-service
          npm ci

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Tecnosalud-farmacias-2026'
          publish-profile: ${{ secrets.AZURE_WEBAPP_FARMACIAS_PUBLISH_PROFILE }}
          package: 'backend/services/farmacias-service'
